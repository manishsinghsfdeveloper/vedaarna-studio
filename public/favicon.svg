<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" fill="#f5f0eb"/>
  <!-- V shape -->
  <polygon points="5,15 20,15 50,75 80,15 95,15 50,90" fill="#8B3A3A"/>
  <!-- A crossbar cutout area already handled by V overlap -->
  <!-- Dress form / mannequin torso on top of V -->
  <ellipse cx="50" cy="22" rx="10" ry="5" fill="#8B3A3A"/>
  <path d="M40,22 Q35,30 37,40 Q43,45 50,45 Q57,45 63,40 Q65,30 60,22 Z" fill="#8B3A3A"/>
  <!-- Shoulder strap left -->
  <path d="M40,22 Q38,18 42,15" stroke="#8B3A3A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Shoulder strap right -->
  <path d="M60,22 Q62,18 58,15" stroke="#8B3A3A" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
