# wrangler.toml — VedAarna Studio storefront
#
# Adds custom domain config on top of Nitro-generated .output/server/wrangler.json.
# DEPLOY: npm run build && npx wrangler deploy
# VITE_* env vars are read from .env.production at build time (gitignored).

name = "vedaarna-studio"
compatibility_date = "2026-09-22"

workers_dev = false

# Routes match the existing bindings already live in Cloudflare
routes = [
  { pattern = "vedaarnastudio.com/*", zone_name = "vedaarnastudio.com" },
  { pattern = "www.vedaarnastudio.com/*", zone_name = "vedaarnastudio.com" },
]

# Runtime env vars read by TanStack server functions on the Worker.
# RAZORPAY_KEY_SECRET must be added as an ENCRYPTED secret in the Cloudflare
# dashboard (Workers → vedaarna-studio → Settings → Variables & Secrets)
# using:  npx wrangler secret put RAZORPAY_KEY_SECRET
[vars]
RAZORPAY_KEY_ID = "rzp_live_TfN47F6fvWmR9I"
