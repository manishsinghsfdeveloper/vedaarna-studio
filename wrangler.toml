# wrangler.toml — VedAarna Studio storefront
#
# This file adds custom domain routing on top of the Nitro-generated
# .output/server/wrangler.json. Wrangler merges both configs at deploy time.
#
# The Worker name and build config come from .output/server/wrangler.json
# (auto-generated by `npm run build` via Nitro). Do not duplicate those here.

name = "manishsinghsfdeveloper-vedaarna-studio"

# Route all traffic for vedaarnastudio.com through this Worker.
# The zone_name must match the domain added to your Cloudflare account.
routes = [
  { pattern = "vedaarnastudio.com/*", zone_name = "vedaarnastudio.com" },
  { pattern = "www.vedaarnastudio.com/*", zone_name = "vedaarnastudio.com" },
]
